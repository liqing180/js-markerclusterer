name: BossAgent APK Build

on:
  push:
    branches:
      - bossagent-build-20260908
    paths:
      - '.bossagent-src/**'
      - '.github/workflows/bossagent-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Reconstruct BossAgent sources
        shell: bash
        run: |
          set -euo pipefail
          cat .bossagent-src/part*.b64 | base64 --decode > /tmp/bossagent-src.tgz
          rm -rf bossagent
          mkdir -p bossagent
          tar -xzf /tmp/bossagent-src.tgz -C bossagent
          test -f bossagent/app/src/main/AndroidManifest.xml
          test -f bossagent/app/src/main/java/com/openai/bossagent/MainActivity.kt
          echo "Source files: $(find bossagent -type f | wc -l)"
          du -sh bossagent

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p bossagent :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee bossagent-build.log

      - name: Verify APK contents and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="bossagent/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          cp "$APK" BossAgent-v0.1-debug.apk
          ls -lh BossAgent-v0.1-debug.apk
          sha256sum BossAgent-v0.1-debug.apk | tee BossAgent-v0.1-debug.apk.sha256

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BossAgent-v0.1-debug
          path: |
            BossAgent-v0.1-debug.apk
            BossAgent-v0.1-debug.apk.sha256
            apk-signature.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bossagent-build-log
          path: bossagent-build.log
          if-no-files-found: ignore
          retention-days: 7
